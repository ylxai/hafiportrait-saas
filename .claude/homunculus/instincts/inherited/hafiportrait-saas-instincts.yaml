# Hafiportrait Saas Workflow Multi Layer Feature Or Bugfix Touching Api Validation And Ui

## Action

Follow the multi-layer-feature-or-bugfix-touching-api-validation-and-ui workflow:
1. Update or create API route handler(s) in src/app/api/...
2. Update validation schemas in src/lib/api/validation.ts
3. Update or fix frontend UI components/pages in src/app/(dashboard)/admin/... or src/app/portal/...
4. If authentication or authorization is involved, update src/lib/auth/options.ts or related files
5. Test the integrated flow end-to-end

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: src/app/api/*/route.ts, src/lib/api/validation.ts, src/app/(dashboard)/admin/**/*.tsx

